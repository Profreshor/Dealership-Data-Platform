services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
    environment:
      DDP_DEV_DATABASE_URL: postgres://postgres:ddp-local-only@postgres:5432/ddp_development?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:ddp-local-only@postgres:5432/ddp_development?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ddp-local-only
      POSTGRES_DB: ddp_development
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d ddp_development"]
      interval: 2s
      timeout: 5s
      retries: 20
