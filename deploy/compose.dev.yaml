services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ddp-local-only
      POSTGRES_DB: ddp_development
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d ddp_development"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - development-postgres:/var/lib/postgresql/data
volumes:
  development-postgres:
